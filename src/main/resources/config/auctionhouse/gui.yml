# ===================================
# OEssentials - Auction House GUI
# ===================================
#
# Customise how every /ah menu looks.
#
# Slots: raw inventory position (0-53 for 6 rows).
#   Row 0 = slots 0-8   | Row 1 = slots 9-17
#   Row 2 = slots 18-26 | Row 3 = slots 27-35
#   Row 4 = slots 36-44 | Row 5 = slots 45-53
#
# Use & colour codes (e.g. &6&l for bold gold).
# Supports: {page}, {category}, {query}, {count} depending on the button.

# ─────────────────────────────────────
# Main menu - browse listings
# ─────────────────────────────────────
browse:
  title: "&6&lAuction House"
  title-category: "&6&lAuction House &8- &e{category}"
  title-search: "&6&lSearch: &f{query}"
  title-search-category: "&6&lSearch: &f{query} &8- &e{category}"
  border: GRAY_STAINED_GLASS_PANE
  buttons:
    prev-page:
      slot: 48
      material: ARROW
      name: "&e&lPrevious Page"
    next-page:
      slot: 50
      material: ARROW
      name: "&e&lNext Page"
    page-indicator:
      slot: 49
      material: PAPER
      name: "&ePage {page}"
    clear-search:
      slot: 45
      material: MAP
      name: "&f&lEffacer la recherche"
    categories:
      slot: 46
      material: COMPASS
      name: "&b&lCategories"
    back-to-all:
      slot: 46
      material: BARRIER
      name: "&c&lBack to All"
    your-listings:
      slot: 52
      material: CHEST
      name: "&6&lYour Listings"
    close:
      slot: 53
      material: BARRIER
      name: "&c&lClose"
    no-auctions:
      slot: 22
      material: BARRIER
      name: "&c&lNo Auctions Available"
    no-results:
      slot: 22
      material: BARRIER
      name: "&c&lNo Results"

# ─────────────────────────────────────
# Categories menu
# ─────────────────────────────────────
categories:
  title: "&b&lCategories"
  border: CYAN_STAINED_GLASS_PANE
  buttons:
    back:
      slot: 49
      material: BARRIER
      name: "&c&lBack to Browse"

# ─────────────────────────────────────
# Listing (sell) menu
# ─────────────────────────────────────
sell:
  title: "&6&lChoose a Category"
  border: ORANGE_STAINED_GLASS_PANE
  buttons:
    confirm:
      slot: 52
      material: GREEN_WOOL
      name: "&a&l✔ CONFIRMER LA VENTE"
    cancel:
      slot: 46
      material: RED_WOOL
      name: "&c&l✗ ANNULER"

# ─────────────────────────────────────
# Manage your listings menu
# ─────────────────────────────────────
manage:
  title: "&6&lYour Listings"
  border: GRAY_STAINED_GLASS_PANE
  buttons:
    prev-page:
      slot: 48
      material: ARROW
      name: "&e&lPrevious"
    next-page:
      slot: 50
      material: ARROW
      name: "&e&lNext"
    expired:
      slot: 46
      material: RED_WOOL
      name: "&c&lExpired ({count})"
    sold:
      slot: 52
      material: GREEN_WOOL
      name: "&a&lVendues ({count})"
    back:
      slot: 49
      material: BARRIER
      name: "&c&lBack"
    no-listings:
      slot: 22
      material: BARRIER
      name: "&c&lNo Active Listings"
      lore:
        - "&7Use &e/ahs <price> &7to list an item!"

# ─────────────────────────────────────
# Purchase confirmation menu
# ─────────────────────────────────────
confirm:
  title: "&e&lConfirm Purchase"
  border: GRAY_STAINED_GLASS_PANE
  buttons:
    confirm:
      slot: 11
      material: GREEN_WOOL
      name: "&a&l✔ CONFIRMER L'ACHAT"
    cancel:
      slot: 15
      material: RED_WOOL
      name: "&c&l✗ ANNULER"
    info:
      slot: 22
      material: PAPER
      name: "&e&lInformations sur l'achat"

# ─────────────────────────────────────
# Sold items menu
# ─────────────────────────────────────
sold:
  title: "&a&lArticles vendus"
  border: GREEN_STAINED_GLASS_PANE
  buttons:
    prev-page:
      slot: 48
      material: ARROW
      name: "&e&lPrevious"
    next-page:
      slot: 50
      material: ARROW
      name: "&e&lNext"
    back:
      slot: 49
      material: BARRIER
      name: "&c&lBack"
    no-sold:
      slot: 22
      material: BARRIER
      name: "&e&lNo Sold Items Yet"

# ─────────────────────────────────────
# Expired listings menu
# ─────────────────────────────────────
expired:
  title: "&c&lExpired Listings"
  border: RED_STAINED_GLASS_PANE
  buttons:
    prev-page:
      slot: 48
      material: ARROW
      name: "&e&lPrevious"
    next-page:
      slot: 50
      material: ARROW
      name: "&e&lNext"
    back:
      slot: 49
      material: BARRIER
      name: "&c&lBack"
    reclaim-all:
      slot: 46
      material: CHEST
      name: "&a&lReclaim All ({count})"
    no-expired:
      slot: 22
      material: BARRIER
      name: "&a&lNo Expired Items!"
